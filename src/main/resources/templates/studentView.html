<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
  <h2 th:text="#{RegisterButton}">학생 정보 조회</h2> <!-- 임시로 등록 키 사용, 별도 타이틀 필요 시 추가 -->
  <p><span th:text="#{ID}"></span> <span th:text="${student.id}"></span></p>
  <p><span th:text="#{MaskedPassword}"></span> <span th:text="${student.maskedPassword}"></span></p>
  <p><span th:text="#{Name}"></span> <span th:text="${student.name}"></span></p>
  <p><span th:text="#{Email}"></span> <span th:text="${student.email}"></span></p>

  <div th:if="${hideScore != true}">
    <p><span th:text="#{Score}"></span> <span th:text="${student.score}"></span></p>
    <p><span th:text="#{Comment}"></span> <span th:text="${student.comment}"></span></p>
  </div>

  <a th:href="@{/student/{id}/modify(id=${student.id})}"><span th:text="#{ModifyButton}"></span></a>
  <a th:href="@{/student/register}"><span th:text="#{RegisterButton}"></span></a>

  <form method="get" action="/logout" style="display:inline;"><button type="submit">로그아웃</button></form>
</body>
</html>
