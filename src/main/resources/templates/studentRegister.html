<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>학생 정보 등록 화면</title>
</head>
<body>
<form method="post" action="/student/register" th:object="${student}">
  아이디: <input type="text" th:field="*{id}"><br>
  비밀번호: <input type="text" th:field="*{password}"><br>
  이름: <input type="text" th:field="*{name}"><br>
  이메일: <input type="text" th:field="*{email}"><br>
  성적: <input type="text" th:field="*{score}"><br>
  평가: <input type="text" th:field="*{comment}">
    <input type="submit"/>

</form>

</body>
</html>
